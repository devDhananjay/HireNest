services:
  postgres:
    image: postgres:16-alpine
    container_name: hireora-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: hireora
    volumes:
      - hireora_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d hireora"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  hireora_pg:
